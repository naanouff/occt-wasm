name: build-wasm

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Build OCCT wasm
        run: docker build -t occt-wasm .

      - name: Extract dist
        run: |
          docker create --name occt-out occt-wasm
          docker cp occt-out:/opt/dist dist
          docker rm occt-out

      - uses: actions/upload-artifact@v4
        with:
          name: occt-step-wasm
          path: dist
          if-no-files-found: error

      - name: Require tag on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} must point to a commit reachable from main (gitflow)."
            exit 1
          fi

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/occt-step.wasm
            dist/occt-step.js
            dist/link-libs.txt
            dist/LICENSE_LGPL_21.txt
            dist/OCCT_LGPL_EXCEPTION.txt
          body: |
            OCCT STEP wasm build `${{ github.sha }}`.

            Artefacts : `occt-step.wasm`, `occt-step.js`, licences LGPL.
